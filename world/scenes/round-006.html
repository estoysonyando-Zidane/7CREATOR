<!doctype html>
<meta charset="utf-8">
<title>第六巡の世界</title>
<style>
  html, body { margin: 0; background: #05060a; }
  body {
    width: 1600px; height: 1000px; position: relative; overflow: hidden;
    font-family: "IPAPGothic", "IPAGothic", sans-serif; color: #cfd6e6;
  }
  .caption { position: absolute; left: 64px; top: 56px; }
  .caption h1 { margin: 0; font-size: 30px; letter-spacing: .3em; font-weight: normal; color: #eef2ff; }
  .caption p { margin: 14px 0 0; font-size: 16px; line-height: 1.8; color: #7f8aa3; max-width: 620px; }
  .label { font-size: 15px; fill: #93a0bb; letter-spacing: .12em; }
  .label.dim { fill: #5d6880; }
  .leader { stroke: #3a4560; stroke-width: 1; }
</style>

<div class="caption">
  <h1>第六巡</h1>
  <p>道具屋「……代わりに枠へ耳をつけとくよ。<br>入れた形の音が底まで届く」</p>
</div>

<svg width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ffd98a" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ff9d3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffcf7a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffcf7a" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffcf7a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cycle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffcf7a" stop-opacity=".8"/>
      <stop offset="50%" stop-color="#2b3352" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#ffcf7a" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="sediment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2036"/>
      <stop offset="100%" stop-color="#090c16"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- 一：光 -->
  <circle cx="900" cy="360" r="300" fill="url(#glow)"/>
  <circle cx="900" cy="360" r="46" fill="#fff8e2"/>

  <!-- 一：蓋（覆いきれない） -->
  <path d="M 620 360 A 280 280 0 0 1 1180 360 Z" fill="#0a0d17" stroke="#39425e" stroke-width="2"/>
  <rect x="600" y="352" width="600" height="12" fill="url(#leak)" filter="url(#soft)"/>
  <line x1="620" y1="360" x2="1180" y2="360" stroke="#ffcf7a" stroke-width="2" opacity=".9"/>

  <!-- 二：縁の足場（漏れた光を固めたもの・暗がりで溶ける） -->
  <rect x="472" y="372" width="180" height="9" rx="4" fill="#ffd489" opacity=".85"/>
  <rect x="1148" y="372" width="180" height="9" rx="4" fill="#ffd489" opacity=".55"/>
  <rect x="1190" y="392" width="96" height="6" rx="3" fill="#ffd489" opacity=".22"/>
  <!-- 縁で踊る者 -->
  <circle cx="560" cy="360" r="5" fill="#fff3d0"/>
  <circle cx="596" cy="356" r="4" fill="#fff3d0" opacity=".7"/>

  <!-- 三：昼と夜の周期 -->
  <rect x="472" y="452" width="856" height="6" rx="3" fill="url(#cycle)"/>
  <circle cx="900" cy="455" r="7" fill="#2b3352" stroke="#6f7ca0" stroke-width="1.5"/>

  <!-- 四：枠（一日ひとつだけ形を写す） -->
  <rect x="700" y="530" width="200" height="150" fill="none" stroke="#9fb0d6" stroke-width="3"/>
  <!-- 六：三日続けて同じ石 -->
  <ellipse cx="800" cy="612" rx="46" ry="36" fill="#ffd489" opacity=".9"/>
  <ellipse cx="612" cy="612" rx="46" ry="36" fill="none" stroke="#6f7ca0" stroke-width="2"/>
  <ellipse cx="504" cy="612" rx="46" ry="36" fill="none" stroke="#4a5573" stroke-width="2"/>
  <line x1="550" y1="612" x2="566" y2="612" stroke="#4a5573" stroke-width="1"/>
  <line x1="658" y1="612" x2="674" y2="612" stroke="#6f7ca0" stroke-width="1"/>

  <!-- 六：枠につけた耳と、底へ降りていく音 -->
  <path d="M 900 566 q 34 0 34 30 q 0 22 -22 22" fill="none" stroke="#9fb0d6" stroke-width="3"/>

  <!-- 五：選ばれなかった形の沈殿層 -->
  <rect x="0" y="790" width="1600" height="210" fill="url(#sediment)"/>
  <path d="M 0 790 Q 400 762 800 792 T 1600 782 L 1600 800 L 0 800 Z" fill="#232b45"/>
  <line x1="0" y1="852" x2="1600" y2="846" stroke="#161d31" stroke-width="3"/>
  <line x1="0" y1="898" x2="1600" y2="906" stroke="#121828" stroke-width="3"/>
  <line x1="0" y1="946" x2="1600" y2="938" stroke="#0e1322" stroke-width="3"/>
  <g fill="#38425f" opacity=".85">
    <circle cx="260" cy="868" r="11"/><rect x="520" y="874" width="26" height="14"/>
    <path d="M 880 862 l 20 26 l -40 0 Z"/><circle cx="1200" cy="884" r="8"/>
    <rect x="1380" y="912" width="34" height="10"/><circle cx="700" cy="926" r="9"/>
  </g>
  <!-- 六：枠から底へ降りていく音（沈殿層を貫く） -->
  <line x1="800" y1="680" x2="800" y2="906" stroke="#7f8aa3" stroke-width="1.5" stroke-dasharray="3 7"/>
  <g fill="none" stroke="#aab6d2">
    <path d="M 750 722 a 66 66 0 0 0 102 0" opacity=".6"/>
    <path d="M 726 782 a 92 92 0 0 0 146 0" opacity=".45"/>
    <path d="M 700 844 a 120 120 0 0 0 194 0" opacity=".28"/>
  </g>

  <!-- 底へ潜った一途者（返事はない） -->
  <line x1="520" y1="686" x2="452" y2="884" stroke="#3a4560" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="452" cy="890" r="6" fill="none" stroke="#7f8aa3" stroke-width="2"/>

  <!-- 註 -->
  <g class="label">
    <line class="leader" x1="946" y1="376" x2="1290" y2="228"/>
    <text x="1300" y="233">光</text>
    <line class="leader" x1="1150" y1="270" x2="1290" y2="288"/>
    <text x="1300" y="293">蓋</text>
    <line class="leader" x1="520" y1="376" x2="300" y2="330"/>
    <text x="112" y="335">縁の足場</text>
    <line class="leader" x1="700" y1="455" x2="300" y2="430"/>
    <text x="146" y="435">昼と夜</text>
    <line class="leader" x1="700" y1="540" x2="430" y2="516"/>
    <text x="212" y="512">枠</text>
    <text class="dim" x="436" y="546">同じ石</text>
    <line class="leader" x1="934" y1="596" x2="1180" y2="560"/>
    <text x="1190" y="565">耳</text>
    <line class="leader" x1="900" y1="772" x2="1180" y2="716"/>
    <text x="1190" y="721">音</text>
    <line class="leader" x1="1280" y1="880" x2="1180" y2="820"/>
    <text x="1190" y="812">選ばれなかった形</text>
    <text class="dim" x="112" y="894">潜った者</text>
  </g>
</svg>
