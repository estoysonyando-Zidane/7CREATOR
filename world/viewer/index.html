<title>縁の生き物</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --void: #05060a;
    --ink: #d5dcec;
    --dim: #79839c;
    --rim: #ffcf7a;
    --panel: rgba(8, 10, 18, .72);
    --edge: rgba(150, 165, 200, .22);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--void); color: var(--ink); overflow: hidden;
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "IPAPGothic", sans-serif;
  }
  canvas { display: block; }
  .hud { position: fixed; pointer-events: none; z-index: 2; }
  .hud.tl { top: 0; left: 0; padding: 20px 16px; }
  .hud.br { right: 0; bottom: 0; padding: 20px 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .hud.bl { left: 0; bottom: 0; padding: 20px 16px; max-width: min(560px, 72vw); }
  .round {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px;
    letter-spacing: .22em; color: var(--rim); text-transform: uppercase;
  }
  h1 { margin: 6px 0 0; font-size: 20px; font-weight: 500; letter-spacing: .16em; }
  .clockline { margin-top: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--dim); letter-spacing: .12em; }
  .legend { pointer-events: auto; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .legend button {
    font: inherit; font-size: 12px; letter-spacing: .1em; cursor: pointer;
    background: var(--panel); color: var(--ink); border: 1px solid var(--edge);
    padding: 4px 10px; display: flex; align-items: center; gap: 8px;
  }
  .legend button[aria-pressed="false"] { color: var(--dim); opacity: .5; }
  .legend button:focus-visible { outline: 2px solid var(--rim); outline-offset: 2px; }
  .swatch { width: 8px; height: 8px; }
  .quote {
    background: var(--panel); border-left: 2px solid var(--rim); padding: 10px 14px;
    font-size: 15px; line-height: 1.7; min-height: 0; transition: opacity .2s;
  }
  .quote[hidden] { display: none; }
  .quote b { display: block; font-size: 11px; font-weight: 500; letter-spacing: .2em; color: var(--dim); margin-bottom: 4px; }
  .keys { margin-top: 10px; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--dim); letter-spacing: .08em; }
  .start {
    position: fixed; inset: 0; z-index: 3; display: grid; place-content: center; gap: 14px;
    text-align: center; background: rgba(5, 6, 10, .82); cursor: pointer;
  }
  .start p { margin: 0; font-size: 14px; color: var(--dim); letter-spacing: .1em; }
  .start strong { font-size: 17px; font-weight: 500; letter-spacing: .2em; color: var(--ink); }
  .start[hidden] { display: none; }
  .touch { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 2; display: none; gap: 10px; }
  .touch button { font: inherit; font-size: 13px; padding: 10px 18px; background: var(--panel); color: var(--ink); border: 1px solid var(--edge); }
  @media (hover: none) { .touch { display: flex; } .keys { display: none; } }
  @media (prefers-reduced-motion: reduce) { .quote { transition: none; } }
</style>

<div class="hud tl">
  <div class="round" id="roundLabel">巡 —</div>
  <h1>縁 の 生 き 物</h1>
  <div class="clockline" id="clock">昼</div>
</div>

<div class="hud br">
  <div class="legend" id="legend"></div>
</div>

<div class="hud bl">
  <div class="quote" id="quote" hidden></div>
  <div class="keys">W A S D 移動 ／ SPACE 上 ／ SHIFT 下 ／ マウス 視線 ／ ESC 解除</div>
</div>

<div class="touch">
  <button type="button" id="fwd">前へ</button>
  <button type="button" id="back">後ろへ</button>
</div>

<div class="start" id="start">
  <strong>この世界に入る</strong>
  <p>画面をクリックすると視線が繋がる</p>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function () {
  const HUE = {
    理想主義者: '#9fd7ff', 享楽主義者: '#ff9ec4', 深読み屋: '#a48cff', 一途者: '#ffb15c',
    皮肉屋: '#9fb3a8', 感傷屋: '#d8b4ff', 道具屋: '#7fd6c0'
  };
  const DAY = 90; // 一巡りの秒数

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#05060a');
  scene.fog = new THREE.FogExp2('#05060a', 0.0042);

  const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 2000);
  camera.position.set(78, 62, 62);
  camera.lookAt(0, 40, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight('#3d4a70', 1.15));
  const core = new THREE.PointLight('#ffd9a0', 14000, 900, 2);
  core.position.set(0, 48, 0);
  scene.add(core);

  const groups = {};   // 人格ごとの表示切り替え
  const melting = [];  // 夜に溶けるもの
  const daytimeOnly = [];
  const crumbling = [];
  const pulsing = [];
  const pickable = [];

  function mat(color, opts) {
    opts = opts || {};
    if (opts.wire) {
      return new THREE.MeshBasicMaterial({ color: color, wireframe: true, transparent: true, opacity: opts.opacity || 0.3 });
    }
    if (opts.emissive) {
      return new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: opts.opacity || 1 });
    }
    return new THREE.MeshStandardMaterial({
      color: color, roughness: 0.85, metalness: 0.05,
      transparent: opts.opacity !== undefined, opacity: opts.opacity === undefined ? 1 : opts.opacity,
      side: opts.side || THREE.FrontSide
    });
  }

  const rad = d => d * Math.PI / 180;

  function build(shape, color, opts) {
    const g = new THREE.Group();
    const m = () => mat(color, opts);
    const p = shape.p || [0, 0, 0];
    switch (shape.type) {
      case 'sphere': {
        const o = new THREE.Mesh(new THREE.SphereGeometry(shape.r, 32, 24), m());
        o.position.set(p[0], p[1], p[2]); g.add(o); break;
      }
      case 'dome': {
        const o = new THREE.Mesh(
          new THREE.SphereGeometry(shape.r, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2),
          mat(color, Object.assign({ side: THREE.DoubleSide }, opts)));
        o.position.set(p[0], p[1], p[2]); g.add(o); break;
      }
      case 'shell': {
        const o = new THREE.Mesh(
          new THREE.SphereGeometry(shape.r, 40, 20, rad(shape.from), rad(shape.to - shape.from), 0, Math.PI * 0.62),
          mat(color, Object.assign({ side: THREE.DoubleSide, wire: true, opacity: 0.12 }, opts)));
        o.position.set(p[0], p[1], p[2]); g.add(o); break;
      }
      case 'ring': case 'torus': {
        const o = new THREE.Mesh(new THREE.TorusGeometry(shape.r, shape.tube, 10, 90), m());
        o.position.set(p[0], p[1], p[2]);
        o.rotation.set(shape.rot ? shape.rot[0] : Math.PI / 2, shape.rot ? shape.rot[1] : 0, shape.rot ? shape.rot[2] : 0);
        g.add(o); break;
      }
      case 'arc_slabs': {
        for (let i = 0; i < shape.count; i++) {
          const a = rad(shape.from + (shape.to - shape.from) * (i / (shape.count - 1)));
          const o = new THREE.Mesh(new THREE.BoxGeometry(shape.size[0], shape.size[1], shape.size[2]), m());
          o.position.set(Math.cos(a) * shape.r + p[0], p[1], Math.sin(a) * shape.r + p[2]);
          o.rotation.y = -a;
          g.add(o);
        }
        break;
      }
      case 'motes': {
        const geo = new THREE.SphereGeometry(shape.r, 8, 6);
        for (let i = 0; i < shape.count; i++) {
          const o = new THREE.Mesh(geo, m());
          o.position.set(
            p[0] + (Math.random() - 0.5) * shape.spread[0],
            p[1] + (Math.random() - 0.5) * shape.spread[1],
            p[2] + (Math.random() - 0.5) * shape.spread[2]);
          g.add(o);
        }
        break;
      }
      case 'clock': {
        const o = new THREE.Mesh(new THREE.TorusGeometry(shape.r, 0.18, 6, 120), mat(color, Object.assign({ opacity: 0.5, emissive: true }, opts)));
        o.position.set(p[0], p[1], p[2]); o.rotation.x = Math.PI / 2; g.add(o);
        const mark = new THREE.Mesh(new THREE.SphereGeometry(1.1, 12, 10), mat(color, { emissive: true }));
        mark.name = 'hand'; g.add(mark); break;
      }
      case 'frame': {
        const [w, h, t] = shape.size, b = 0.5;
        const parts = [[0, h / 2, w, b], [0, -h / 2, w, b], [-w / 2, 0, b, h], [w / 2, 0, b, h]];
        parts.forEach(q => {
          const o = new THREE.Mesh(new THREE.BoxGeometry(q[2], q[3], t), m());
          o.position.set(q[0], q[1], 0); g.add(o);
        });
        g.position.set(p[0], p[1], p[2]); g.rotation.y = Math.PI / 2; break;
      }
      case 'stone': {
        const o = new THREE.Mesh(new THREE.IcosahedronGeometry(shape.r, 1), m());
        o.position.set(p[0], p[1], p[2]); o.scale.set(1, 0.76, 1.12); g.add(o); break;
      }
      case 'stone_row': {
        for (let i = 0; i < shape.count; i++) {
          const o = new THREE.Mesh(new THREE.IcosahedronGeometry(shape.r, 1), m());
          const d = shape.gap * (i + 1);
          o.position.set(p[0], p[1], p[2] + (shape.axis === 'z' ? d : 0));
          o.scale.set(1, 0.76, 1.12); g.add(o);
        }
        break;
      }
      case 'rings_down': {
        for (let i = 0; i < shape.count; i++) {
          const k = i / (shape.count - 1);
          const o = new THREE.Mesh(
            new THREE.TorusGeometry(shape.r0 + (shape.r1 - shape.r0) * k, 0.14, 6, 40),
            mat(color, { emissive: true, opacity: 0.5 - 0.34 * k }));
          o.position.set(p[0] + (shape.to[0] - p[0]) * k, p[1] + (shape.to[1] - p[1]) * k, p[2] + (shape.to[2] - p[2]) * k);
          o.rotation.x = Math.PI / 2; g.add(o);
        }
        break;
      }
      case 'disc': {
        const o = new THREE.Mesh(new THREE.CylinderGeometry(shape.r, shape.r * 0.94, shape.h, 72), m());
        o.position.set(p[0], p[1], p[2]); g.add(o); break;
      }
      case 'dish': {
        const o = new THREE.Mesh(
          new THREE.SphereGeometry(shape.r, 28, 14, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
          mat(color, Object.assign({ side: THREE.DoubleSide }, opts)));
        o.position.set(p[0], p[1], p[2]); g.add(o); break;
      }
      case 'cone': {
        const o = new THREE.Mesh(new THREE.ConeGeometry(shape.r, shape.h, 20), m());
        o.position.set(p[0], p[1] + shape.h / 2, p[2]); g.add(o); break;
      }
      case 'axis': {
        const o = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, shape.h, 8), mat(color, { emissive: true, opacity: 0.42 }));
        o.position.set(p[0], p[1] - shape.h / 4, p[2]); g.add(o); break;
      }
      case 'cord': {
        const a = new THREE.Vector3().fromArray(shape.from), b2 = new THREE.Vector3().fromArray(shape.to);
        const mid = a.clone().add(b2).multiplyScalar(0.5).setY((a.y + b2.y) / 2 - shape.sag);
        const curve = new THREE.QuadraticBezierCurve3(a, mid, b2);
        const o = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.22, 6, false), mat(color, { emissive: true, opacity: 0.8 }));
        g.add(o); break;
      }
      case 'net': {
        for (let i = 1; i <= shape.rings; i++) {
          const o = new THREE.Mesh(new THREE.TorusGeometry(shape.r * (i / shape.rings), 0.12, 6, 60),
            mat(color, { emissive: true, opacity: 0.4 }));
          o.position.set(p[0], p[1], p[2]); o.rotation.x = Math.PI / 2; g.add(o);
        }
        for (let i = 0; i < shape.spokes; i++) {
          const a = (i / shape.spokes) * Math.PI * 2;
          const o = new THREE.Mesh(new THREE.BoxGeometry(shape.r, 0.1, 0.1), mat(color, { emissive: true, opacity: 0.3 }));
          o.position.set(p[0] + Math.cos(a) * shape.r / 2, p[1], p[2] + Math.sin(a) * shape.r / 2);
          o.rotation.y = -a; g.add(o);
        }
        break;
      }
      case 'arc_up': {
        const a = new THREE.Vector3().fromArray(shape.from), b2 = new THREE.Vector3().fromArray(shape.to);
        const mid = a.clone().add(b2).multiplyScalar(0.5).setY((a.y + b2.y) / 2 + shape.lift);
        const curve = new THREE.QuadraticBezierCurve3(a, mid, b2);
        curve.getPoints(shape.count).forEach((pt, i) => {
          const o = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 6), mat(color, { emissive: true, opacity: 0.2 + 0.5 * (i / shape.count) }));
          o.position.copy(pt); g.add(o);
        });
        break;
      }
    }
    return g;
  }

  function place(entity, spec, author, isVariant) {
    const g = build(spec.shape || entity.shape, isVariant ? (HUE[author] || entity.color) : entity.color, {
      wire: isVariant || spec.wire || entity.wire,
      emissive: !isVariant && entity.emissive,
      opacity: isVariant ? 0.26 : undefined
    });
    g.userData = {
      by: author,
      quote: spec.quote || entity.quote,
      name: entity.name + (isVariant ? '（' + author + 'の言う' + entity.name + '）' : ''),
      born: entity.born
    };
    (groups[author] = groups[author] || []).push(g);
    if (entity.melts_at_night && !isVariant) melting.push(g);
    if (entity.only_daytime) daytimeOnly.push(g);
    if (entity.crumbles && !isVariant) crumbling.push(g);
    if (spec.pulse) pulsing.push(g);
    g.traverse(o => { if (o.isMesh) { o.userData.owner = g; pickable.push(o); } });
    scene.add(g);
    return g;
  }

  const clockHands = [];

  fetch('model.json').then(r => r.json()).then(model => {
    document.getElementById('roundLabel').textContent = '巡 ' + String(model.round).padStart(3, '0');
    model.entities.forEach(e => {
      const g = place(e, e, e.by, false);
      g.traverse(o => { if (o.name === 'hand') clockHands.push(o); });
      (e.variants || []).forEach(v => place(e, v, v.by, true));
    });
    buildLegend();
  });

  function buildLegend() {
    const el = document.getElementById('legend');
    Object.keys(groups).forEach(who => {
      const b = document.createElement('button');
      b.type = 'button';
      b.id = 'toggle-' + who;
      b.setAttribute('aria-pressed', 'true');
      b.innerHTML = '<span class="swatch" style="background:' + (HUE[who] || '#888') + '"></span>' + who;
      b.addEventListener('click', () => {
        const on = b.getAttribute('aria-pressed') === 'false';
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        groups[who].forEach(g => { g.visible = on; g.userData.shown = on; });
      });
      el.appendChild(b);
    });
  }

  // ---- 視線と移動 -------------------------------------------------------
  const keys = {};
  const euler = new THREE.Euler(0, 0, 0, 'YXZ');
  euler.setFromQuaternion(camera.quaternion);
  let locked = false, touchForward = 0;

  const startEl = document.getElementById('start');
  if (location.search.indexOf('still') >= 0) {   // 静止画の書き出し用
    startEl.hidden = true;
    document.querySelector('.touch').style.display = 'none';
  }
  renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock());
  startEl.addEventListener('click', () => renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock());
  document.addEventListener('pointerlockchange', () => {
    locked = document.pointerLockElement === renderer.domElement;
    startEl.hidden = locked;
  });
  document.addEventListener('mousemove', e => {
    if (!locked) return;
    euler.setFromQuaternion(camera.quaternion);
    euler.y -= e.movementX * 0.0022;
    euler.x -= e.movementY * 0.0022;
    euler.x = Math.max(-1.5, Math.min(1.5, euler.x));
    camera.quaternion.setFromEuler(euler);
  });
  addEventListener('keydown', e => { keys[e.code] = true; });
  addEventListener('keyup', e => { keys[e.code] = false; });

  let dragging = null;
  renderer.domElement.addEventListener('touchstart', e => { dragging = e.touches[0]; startEl.hidden = true; }, { passive: true });
  renderer.domElement.addEventListener('touchmove', e => {
    if (!dragging) return;
    const t = e.touches[0];
    euler.setFromQuaternion(camera.quaternion);
    euler.y -= (t.clientX - dragging.clientX) * 0.005;
    euler.x -= (t.clientY - dragging.clientY) * 0.005;
    euler.x = Math.max(-1.5, Math.min(1.5, euler.x));
    camera.quaternion.setFromEuler(euler);
    dragging = t;
  }, { passive: true });
  renderer.domElement.addEventListener('touchend', () => { dragging = null; }, { passive: true });
  document.getElementById('fwd').addEventListener('touchstart', () => { touchForward = 1; }, { passive: true });
  document.getElementById('back').addEventListener('touchstart', () => { touchForward = -1; }, { passive: true });
  ['touchend', 'touchcancel'].forEach(ev => {
    document.getElementById('fwd').addEventListener(ev, () => { touchForward = 0; }, { passive: true });
    document.getElementById('back').addEventListener(ev, () => { touchForward = 0; }, { passive: true });
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // ---- 昼と夜 -----------------------------------------------------------
  const ray = new THREE.Raycaster();
  const quoteEl = document.getElementById('quote');
  const clockEl = document.getElementById('clock');
  const clock = new THREE.Clock();
  let t = 0, look = 0;

  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05);
    t += dt;
    const phase = (t % DAY) / DAY;              // 0 昼 → 1 夜
    const day = 0.5 + 0.5 * Math.cos(phase * Math.PI * 2);

    core.intensity = 3200 + 12000 * day;
    scene.fog.density = 0.0052 - 0.0018 * day;
    clockEl.textContent = day > 0.55 ? '昼' : day > 0.3 ? '昼と夜のあいだ' : '夜';

    melting.forEach(g => {
      g.scale.y = 0.08 + 0.92 * day;
      g.traverse(o => { if (o.isMesh && o.material.transparent !== undefined) { o.material.transparent = true; o.material.opacity = 0.12 + 0.88 * day; } });
    });
    daytimeOnly.forEach(g => { g.visible = day > 0.5 && g.userData.shown !== false; });
    crumbling.forEach(g => {
      const k = (t % 12) / 12;
      g.scale.setScalar(k < 0.7 ? 0.2 + k : Math.max(0.02, 1.2 - (k - 0.7) * 4));
    });
    pulsing.forEach(g => g.traverse(o => { if (o.isMesh) o.material.opacity = 0.18 + 0.16 * (0.5 + 0.5 * Math.sin(t * 2.4)); }));
    clockHands.forEach(h => {
      const a = phase * Math.PI * 2;
      h.position.set(Math.cos(a) * 46, 48, Math.sin(a) * 46);
    });

    const speed = (keys.ShiftLeft || keys.ShiftRight ? 26 : 26) * dt;
    const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
    const right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
    if (keys.KeyW || keys.ArrowUp || touchForward === 1) camera.position.addScaledVector(fwd, speed);
    if (keys.KeyS || keys.ArrowDown || touchForward === -1) camera.position.addScaledVector(fwd, -speed);
    if (keys.KeyA || keys.ArrowLeft) camera.position.addScaledVector(right, -speed);
    if (keys.KeyD || keys.ArrowRight) camera.position.addScaledVector(right, speed);
    if (keys.Space) camera.position.y += speed;
    if (keys.ShiftLeft || keys.ShiftRight) camera.position.y -= speed;

    look += dt;
    if (look > 0.2) {
      look = 0;
      ray.setFromCamera({ x: 0, y: 0 }, camera);
      const hit = ray.intersectObjects(pickable, false).find(h => h.object.userData.owner.visible);
      if (hit && hit.distance < 120) {
        const d = hit.object.userData.owner.userData;
        quoteEl.hidden = false;
        quoteEl.innerHTML = '<b>' + d.name + '　第' + d.born + '巡</b>' + d.by + '「' + d.quote + '」';
      } else {
        quoteEl.hidden = true;
      }
    }

    renderer.render(scene, camera);
  }
  frame();
})();
</script>
